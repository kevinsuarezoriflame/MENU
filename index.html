</head>
<body>
  <header class="top-wrap">
    <div class="topbar">
      <div class="brand" aria-label="KEVIN OS">
        <span class="mark">K</span>
        <span><strong>KEVIN OS</strong><small>APPLICATION HUB</small></span>
      </div>
      <label class="search" for="searchInput">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="7.3"/><path d="m16.5 16.5 5 5"/></svg>
        <input id="searchInput" autocomplete="off" placeholder="Buscar aplicaciones, categorías..." aria-label="Buscar aplicaciones">
        <kbd>Ctrl K</kbd>
      </label>
      <div class="top-actions">
        <span class="edit-status" id="editStatus" aria-live="polite" title="Modo edición habilitado"><span class="edit-status-label">EDICIÓN ACTIVADA</span><span class="edit-status-label" style="opacity:.6">· Ctrl+O</span></span>
        <button type="button" class="btn" id="newCategoryBtn" data-admin-only aria-label="Nueva categoría"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="desktop-label">Categoría</span></button>
        <button type="button" class="btn primary" id="newAppBtn" data-admin-only aria-label="Nueva web"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="desktop-label">Nueva web</span></button>
        <button type="button" class="icon-btn" id="backupBtn" data-admin-only title="Respaldo de datos" aria-label="Respaldo de datos"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3"/></svg></button>
      </div>
    </div>
  </header>
  <main class="shell content">
    <section aria-labelledby="catsHeading">
      <div class="section-head">
        <div class="heading-side"><h1 id="catsHeading">Categorías</h1><span class="count" id="catCount">0</span></div>
        <button class="section-action" id="manageCategories" data-admin-only type="button">Administrar <svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
      </div>
      <div class="category-grid" id="categoryGrid"></div>
    </section>
    <section class="web-section" aria-labelledby="appsHeading" id="webSection">
      <div class="section-head">
        <div class="heading-side"><h2 id="appsHeading">Aplicaciones</h2><span class="count" id="appCount">0</span></div>
        <div class="tools">
          <div class="filter-line" id="quickFilters"></div>
          <label class="sort-wrap">Ordenar <select id="sortBy" aria-label="Ordenar aplicaciones"><option value="recent">Más recientes</option><option value="opened">Últimas abiertas</option><option value="name">Nombre A–Z</option><option value="category">Categoría</option></select></label>
        </div>
      </div>
      <div class="app-grid" id="appGrid"></div>
    </section>
  </main>
  <div id="modalRoot"></div>
  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
  <script>
  (()=>{
    'use strict';
    const KEY='kevin-os-workspace-v1';
    const initialCategories=['Oriflame','PuntoFarma','Logística','Finanzas','Personal'];
    
    const svg={star:'<svg viewBox="0 0 24 24"><path d="m12 2.8 2.87 5.87 6.48.95-4.68 4.57 1.11 6.45L12 17.6l-5.78 3.04 1.11-6.45-4.68-4.57 6.48-.95L12 2.8z"/></svg>',edit:'<svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L9.5 16.5l-4 1 1-4z"/></svg>',arrow:'<svg viewBox="0 0 24 24"><path d="M5 19 19 5M7 5h12v12"/></svg>',close:'<svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg>',plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 3h4m-8 4 1 14h10l1-14M10 11v6m4-6v6"/></svg>'};
    const $=s=>document.querySelector(s);
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    const validUrl=s=>{try{const u=new URL(s);return ['http:','https:'].includes(u.protocol)&&!!u.hostname}catch{return false}};
    const safeHttp=s=>validUrl(s)?s:'';
    const uid=()=>globalThis.crypto?.randomUUID?.()||String(Date.now())+'-'+Math.random().toString(36).slice(2);
    function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&Array.isArray(o.categories)&&Array.isArray(o.apps))return {categories:o.categories.filter(c=>typeof c==='string'),apps:o.apps.filter(a=>a&&typeof a==='object'),icons:(o.icons&&typeof o.icons==='object'&&!Array.isArray(o.icons))?o.icons:{}}}catch{}return {categories:[...initialCategories],apps:[],icons:{}}}
    let data=load();let activeCat='Todas',filter='all',search='',sort='recent',toastTimeout;
    let editMode=false; // No se guarda: cada nueva apertura comienza en modo consulta.
    function requireEdit(){return editMode;}
    function toggleEdit(){editMode=!editMode;document.body.classList.toggle('edit-mode',editMode);if(!editMode)closeModal();render();toast(editMode?'Edición habilitada':'Edición desactivada')}

    function store(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{toast('No se pudo guardar en este navegador');return false}}
    function toast(message){const el=$('#toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.add('hidden'),2600)}
    function catIcon(c){return Object.hasOwn(data.icons,c)?String(data.icons[c]??''):''}
    function countOf(c){return c==='Todas'?data.apps.length:data.apps.filter(a=>a.category===c).length}
    function viewApps(){let list=data.apps.filter(a=>(activeCat==='Todas'||a.category===activeCat)&&(filter!=='favorites'||a.favorite)&&norm([a.name,a.description,a.category,a.url].join(' ')).includes(norm(search)));
      if(sort==='opened')list.sort((a,b)=>(Number(b.lastOpened)||0)-(Number(a.lastOpened)||0));
      if(sort==='name')list.sort((a,b)=>String(a.name).localeCompare(String(b.name),'es'));
      if(sort==='category')list.sort((a,b)=>String(a.category).localeCompare(String(b.category),'es')||String(a.name).localeCompare(String(b.name),'es'));
      return list}
    function render(){
      const catList=['Todas',...data.categories];$('#catCount').textContent=data.categories.length;
      $('#categoryGrid').innerHTML=catList.map(c=>`<button type="button" class="category-tile ${activeCat===c?'active':''}" data-cat="${esc(c)}" aria-pressed="${activeCat===c}">${c!=='Todas'&&catIcon(c)?`<span class="cat-icon">${esc(catIcon(c))}</span>`:''}<span class="cat-bottom"><span class="cat-name">${esc(c)}</span><span class="cat-qty">${countOf(c)}</span></span></button>`).join('');
      $('#quickFilters').innerHTML=`<button class="chip ${filter==='all'?'active':''}" data-filter="all" aria-pressed="${filter==='all'}">Todas</button><button class="chip ${filter==='favorites'?'active':''}" data-filter="favorites" aria-pressed="${filter==='favorites'}">★ Favoritas</button>`;
      const apps=viewApps();$('#appCount').textContent=apps.length;$('#appsHeading').textContent=activeCat==='Todas'?'Aplicaciones':activeCat;
      $('#appGrid').innerHTML=apps.length?apps.map(a=>{
        const src=safeHttp(a.image||'');const emoji=String(a.emoji??'').trim();const abbr=String(a.name||'W').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();
        return `<article class="app-card" data-id="${esc(a.id)}">
          <div class="cover"><i class="cover-corner" aria-hidden="true"></i>${src?`<img loading="lazy" decoding="async" alt="" src="${esc(src)}">`:''}${emoji?`<span class="cover-emoji">${esc(emoji)}</span>`:`<span class="cover-monogram" aria-hidden="true">${esc(abbr)}</span>`}<span class="cover-open">ABRIR ${svg.arrow}</span></div>
          ${editMode?`<button class="card-fav ${a.favorite?'on':''}" type="button" data-fav="${esc(a.id)}" aria-label="${a.favorite?'Quitar de favoritos':'Agregar a favoritos'}" title="Favorito">${svg.star}</button>`:''}
          <div class="card-info"><div class="card-meta-line"><div class="card-category">${esc(a.category||'Sin categoría')}</div>${editMode?`<button type="button" class="card-edit" data-edit="${esc(a.id)}" aria-label="Editar ${esc(a.name)}" title="Editar aplicación">${svg.edit}</button>`:''}</div><h3 class="card-title" title="${esc(a.name)}">${esc(a.name)}</h3><div class="card-desc" title="${esc(a.description||'')}">${esc(a.description||'')}</div></div>
          <a class="card-launch" data-open="${esc(a.id)}" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer" aria-label="Abrir ${esc(a.name)} en otra pestaña"></a>
          </article>`}).join(''):
        `<div class="empty"><div class="empty-symbol">${search?'⌕':'▦'}</div><b>${search?'Sin resultados':filter==='favorites'?'No hay favoritos':'No hay aplicaciones'}</b>${editMode&&!search&&filter!=='favorites'?'<button class="btn primary" id="emptyAdd" type="button">＋ Nueva web</button>':''}</div>`;
    }
    function setCategory(c){activeCat=c;render()}
    function closeModal(){const el=$('#modalRoot');el.replaceChildren();document.removeEventListener('keydown',handleEsc);document.body.style.overflow='';}
    function handleEsc(e){if(e.key==='Escape')closeModal()}
    function showModal(title,content){closeModal();$('#modalRoot').innerHTML=`<div class="overlay" id="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dialog-head"><h3>${esc(title)}</h3><button type="button" class="icon-btn" id="modalClose" aria-label="Cerrar">${svg.close}</button></div>${content}</div></div>`;$('#modalClose').onclick=closeModal;$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});document.addEventListener('keydown',handleEsc);document.body.style.overflow='hidden';setTimeout(()=>$('#modalRoot input:not([type=file])')?.focus(),20)}
    function openAppEditor(id){
      if(!requireEdit())return;
      const a=id?data.apps.find(x=>String(x.id)===String(id)):null;
      const opts=data.categories.map(c=>`<option value="${esc(c)}" ${a?.category===c?'selected':''}>${esc(c)}</option>`).join('');
      showModal(a?'Editar web':'Nueva web',`<form id="appForm" class="form">
        <div class="field"><label for="appName">Nombre</label><input id="appName" maxlength="100" required value="${esc(a?.name||'')}" placeholder="Nombre de la aplicación"></div>
        <div class="field"><label for="appUrl">Enlace</label><input id="appUrl" type="url" maxlength="2048" required value="${esc(a?.url||'')}" placeholder="https://usuario.github.io/proyecto/"></div>
        <div class="field"><label for="appDesc">Descripción</label><textarea id="appDesc" maxlength="240" placeholder="Descripción">${esc(a?.description||'')}</textarea></div>
        <div class="two"><div class="field"><label for="appCat">Categoría</label><select id="appCat" required>${opts}</select></div><div class="field"><label for="appEmoji">Emoji (opcional)</label><div class="emoji-field"><input id="appEmoji" maxlength="20" value="${esc(a?.emoji??'')}" placeholder=""><button type="button" class="emoji-remove" data-clear-emoji="appEmoji">Quitar</button></div></div></div>
        <div class="field"><label for="appImg">URL de portada en GitHub (opcional)</label><input id="appImg" type="url" maxlength="2048" placeholder="https://usuario.github.io/proyecto/portada.webp" value="${esc(a?.image||'')}"></div>
        <div class="form-actions">${a?'<button type="button" id="deleteApp" class="delete">Eliminar web</button>':''}<button type="button" class="btn" id="cancelApp">Cancelar</button><button type="submit" class="btn primary">${a?'Guardar cambios':'Agregar web'}</button></div>
      </form>`);
      $('#cancelApp').onclick=closeModal;
      bindEmojiClear();
      if(a)$('#deleteApp').onclick=()=>{if(confirm(`¿Eliminar "${a.name}"?`)){data.apps=data.apps.filter(x=>x!==a);store();render();closeModal();toast('Web eliminada')}};
      $('#appForm').onsubmit=e=>{
        e.preventDefault();
        const name=$('#appName').value.trim(),url=$('#appUrl').value.trim(),image=$('#appImg').value.trim();
        if(!validUrl(url)||(image&&!validUrl(image))){toast('Revisa la URL ingresada');return}
        const obj={name,url,description:$('#appDesc').value.trim(),category:$('#appCat').value,emoji:$('#appEmoji').value.trim(),image};
        if(a)Object.assign(a,obj);else data.apps.unshift({...obj,id:uid(),favorite:false});
        if(!store())return;
        activeCat='Todas';filter='all';search='';$('#searchInput').value='';closeModal();render();toast(a?'Web actualizada':'Web agregada');
      };
    }
    function bindEmojiClear(){
      document.querySelectorAll('[data-clear-emoji]').forEach(btn=>btn.onclick=()=>{const inp=document.getElementById(btn.dataset.clearEmoji);if(inp){inp.value='';inp.focus()}});
    }
    function categoryManager(){
      if(!requireEdit())return;
      const list=data.categories.map(c=>`<div class="category-row"><div class="category-row-main">${catIcon(c)?`<span class="em">${esc(catIcon(c))}</span>`:''}<div><strong>${esc(c)}</strong><small>${countOf(c)} ${countOf(c)===1?'web':'webs'}</small></div></div><div class="row-actions"><button type="button" class="icon-btn" data-cat-edit="${esc(c)}" aria-label="Editar ${esc(c)}">${svg.edit}</button><button type="button" class="icon-btn" data-cat-delete="${esc(c)}" aria-label="Eliminar ${esc(c)}">${svg.trash}</button></div></div>`).join('');
      showModal('Categorías',`<form id="newCatForm" class="form category-create"><div class="two"><div class="field"><label for="newCatName">Nombre</label><input id="newCatName" maxlength="48" required placeholder="Nueva categoría"></div><div class="field"><label for="newCatEmoji">Emoji (opcional)</label><div class="emoji-field"><input id="newCatEmoji" maxlength="20" placeholder=""><button type="button" class="emoji-remove" data-clear-emoji="newCatEmoji">Quitar</button></div></div></div><button class="btn primary" type="submit">${svg.plus} Crear categoría</button></form><div class="categories-list">${list}</div>`);
      bindEmojiClear();
      $('#newCatForm').onsubmit=e=>{e.preventDefault();const name=$('#newCatName').value.trim(),emoji=$('#newCatEmoji').value.trim();if(!name)return;if(data.categories.some(c=>norm(c)===norm(name))||norm(name)==='todas'){toast('La categoría ya existe');return}data.categories.push(name);data.icons[name]=emoji;if(!store())return;categoryManager();render();toast('Categoría creada')};
      $('#modalRoot').querySelectorAll('[data-cat-edit]').forEach(btn=>btn.onclick=()=>editCategory(btn.dataset.catEdit));
      $('#modalRoot').querySelectorAll('[data-cat-delete]').forEach(btn=>btn.onclick=()=>{const name=btn.dataset.catDelete,n=countOf(name);if(!confirm(`¿Eliminar "${name}"?${n?' Sus aplicaciones quedarán en "Sin categoría".':''}`))return;data.categories=data.categories.filter(c=>c!==name);delete data.icons[name];if(n){if(!data.categories.includes('Sin categoría'))data.categories.push('Sin categoría');data.apps.forEach(a=>{if(a.category===name)a.category='Sin categoría'})}if(activeCat===name)activeCat='Todas';if(!data.categories.length)data.categories=['Personal'];if(!store())return;categoryManager();render();toast('Categoría eliminada')});
    }
    function editCategory(old){
      if(!requireEdit())return;
      showModal('Editar categoría',`<form class="form" id="editCatForm"><div class="field"><label for="editCatName">Nombre</label><input id="editCatName" maxlength="48" required value="${esc(old)}"></div><div class="field"><label for="editCatIcon">Emoji (opcional)</label><div class="emoji-field"><input id="editCatIcon" maxlength="20" value="${esc(catIcon(old))}" placeholder=""><button type="button" class="emoji-remove" data-clear-emoji="editCatIcon">Quitar</button></div></div><div class="form-actions"><button type="button" class="btn" id="backCats">Cancelar</button><button type="submit" class="btn primary">Guardar cambios</button></div></form>`);
      bindEmojiClear();$('#backCats').onclick=categoryManager;
      $('#editCatForm').onsubmit=e=>{e.preventDefault();const next=$('#editCatName').value.trim(),emoji=$('#editCatIcon').value.trim();if(!next)return;if((norm(next)!==norm(old)&&data.categories.some(c=>norm(c)===norm(next)))||norm(next)==='todas'){toast('La categoría ya existe');return}data.categories=data.categories.map(c=>c===old?next:c);data.apps.forEach(a=>{if(a.category===old)a.category=next});if(activeCat===old)activeCat=next;delete data.icons[old];data.icons[next]=emoji;if(!store())return;categoryManager();render();toast('Categoría actualizada')};
    }
    function backupManager(){if(!requireEdit())return;showModal('Respaldo de datos',`<div class="backup-grid"><div class="backup-option"><b>Exportar datos</b><button type="button" id="exportBtn" class="btn primary">Exportar JSON</button></div><div class="backup-option"><b>Importar datos</b><input type="file" id="importFile" accept=".json,application/json"></div></div>`);
      $('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='kevin-os-respaldo-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)};
      $('#importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>5_000_000)throw Error('Archivo muy grande');const raw=JSON.parse(await f.text());if(!raw||!Array.isArray(raw.apps)||!Array.isArray(raw.categories)||raw.apps.length>5000||raw.categories.length>500||!raw.categories.every(c=>typeof c==='string'&&c.trim().length>0&&c.length<=48)||!raw.apps.every(a=>a&&typeof a.name==='string'&&typeof a.url==='string'&&validUrl(a.url)&&typeof a.category==='string'))throw Error('Datos inválidos');if(!confirm('¿Reemplazar todas las webs y categorías por este respaldo?'))return;const categories=[...new Set(raw.categories)],apps=raw.apps.map(a=>({id:uid(),name:String(a.name).slice(0,100),url:a.url,description:String(a.description||'').slice(0,240),category:a.category,emoji:String(a.emoji??'').slice(0,20),image:safeHttp(a.image||''),favorite:!!a.favorite,lastOpened:Number(a.lastOpened)||0}));for(const a of apps)if(!categories.includes(a.category))categories.push(a.category);data={categories:categories.length?categories:['Personal'],apps,icons:(raw.icons&&typeof raw.icons==='object'&&!Array.isArray(raw.icons))?Object.fromEntries(Object.entries(raw.icons).filter(([k,v])=>typeof v==='string').map(([k,v])=>[k,v.slice(0,20)])):{}};if(!store())return;activeCat='Todas';filter='all';search='';$('#searchInput').value='';closeModal();render();toast('Respaldo importado')}catch{toast('Archivo no válido')}};
    }
    $('#newAppBtn').onclick=()=>openAppEditor();$('#newCategoryBtn').onclick=categoryManager;$('#manageCategories').onclick=categoryManager;$('#backupBtn').onclick=backupManager;
    $('#searchInput').oninput=e=>{search=e.target.value.trim();render()};
    $('#categoryGrid').onclick=e=>{const b=e.target.closest('[data-cat]');if(b)setCategory(b.dataset.cat)};
    $('#quickFilters').onclick=e=>{const b=e.target.closest('[data-filter]');if(b){filter=b.dataset.filter;render()}};
    $('#sortBy').onchange=e=>{sort=e.target.value;render()};
    $('#appGrid').addEventListener('click',e=>{const fav=e.target.closest('[data-fav]'),edit=e.target.closest('[data-edit]');if(fav){if(!requireEdit())return;const a=data.apps.find(p=>String(p.id)===fav.dataset.fav);if(a){a.favorite=!a.favorite;store();render()}}else if(edit){if(requireEdit())openAppEditor(edit.dataset.edit);}else if(e.target.id==='emptyAdd'){if(requireEdit())openAppEditor();}else {const link=e.target.closest('[data-open]');if(link){const a=data.apps.find(p=>String(p.id)===link.dataset.open);if(a){a.lastOpened=Date.now();store()}}}});
    $('#appGrid').addEventListener('error',e=>{if(e.target.matches('.cover img'))e.target.remove()},true);
    document.addEventListener('keydown',e=>{
      if((e.ctrlKey||e.metaKey)&&!e.altKey&&!e.shiftKey&&e.key.toLowerCase()==='o'){
        e.preventDefault();e.stopImmediatePropagation();if(!e.repeat)toggleEdit();return;
      }
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#searchInput').focus();$('#searchInput').select()}});
    window.addEventListener('storage',e=>{if(e.key===KEY){data=load();if(activeCat!=='Todas'&&!data.categories.includes(activeCat))activeCat='Todas';render()}});
    render();
  })();
  </script>
</body>
</html>
