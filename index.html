<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <title>KEVIN OS — Aplicaciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#222428;--ink2:#3b4047;--muted:#8b919a;--line:#e7e9ed;--line2:#d8dbe1;--surface:#fff;--canvas:#f7f8fa;--soft:#f3f4f6;--radius:19px;color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--canvas);color:var(--ink);font:14px 'DM Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    button:disabled{opacity:.4;cursor:not-allowed}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #969ba7;outline-offset:3px}
    button{touch-action:manipulation}
    .shell{max-width:1680px;margin:0 auto;padding:0 clamp(18px,3.7vw,64px) 100px}
    .top-wrap{position:sticky;top:0;z-index:15;background:rgba(247,248,250,.95);backdrop-filter:blur(17px);-webkit-backdrop-filter:blur(17px);border-bottom:1px solid var(--line)}
    .topbar{max-width:1680px;margin:auto;min-height:91px;padding:14px clamp(18px,3.7vw,64px);display:flex;gap:clamp(14px,2.3vw,38px);align-items:center}
    .brand{display:flex;align-items:center;gap:12px;flex-shrink:0;min-width:194px}
    .mark{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;color:#fff;background:#25282d;box-shadow:0 6px 18px #20232912;font-family:Manrope,sans-serif;font-size:21px;font-weight:800;letter-spacing:-1px}
    .brand strong{display:block;font:800 19px Manrope,sans-serif;line-height:1.2;letter-spacing:-.95px}
    .brand small{display:block;font-size:9px;letter-spacing:2.15px;color:#9297a0;font-weight:700;margin-top:3px}
    .search{flex:1;min-width:140px;max-width:750px;height:48px;background:#fff;border:1px solid var(--line);border-radius:13px;display:flex;align-items:center;padding:0 15px;gap:11px;transition:border-color .15s,box-shadow .15s}
    .search:focus-within{border-color:#abb0b8;box-shadow:0 0 0 4px #23262c09}
    .search svg{width:18px;height:18px;flex-shrink:0;color:#8a9099}
    .search input{border:0;outline:none;flex:1;width:100%;font-size:13px;min-width:0;background:transparent;color:var(--ink)}
    .search input::placeholder{color:#a1a5ae}
    .search kbd{border:1px solid var(--line);border-radius:6px;padding:4px 6px;color:#a0a5ad;font-size:10px;font-weight:700;white-space:nowrap}
    .top-actions{display:flex;align-items:center;gap:9px;margin-left:auto}
    .btn{display:inline-flex;justify-content:center;align-items:center;gap:9px;border:1px solid var(--line);border-radius:11px;padding:0 16px;min-height:43px;background:#fff;font-weight:700;font-size:12px;white-space:nowrap;color:#393e45;transition:background .16s,border-color .16s,transform .16s}
    .btn:hover{background:#f0f1f3;border-color:#d6d9df}
    .btn:active{transform:scale(.985)}
    .btn.primary{background:#24272b;color:#fff;border-color:#24272b}
    .btn.primary:hover{background:#40444a;border-color:#40444a}
    .btn svg,.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .icon-btn{display:grid;place-items:center;width:40px;height:40px;min-width:40px;border:1px solid var(--line);border-radius:11px;background:#fff;color:#5c626a;transition:background .16s}
    .icon-btn:hover{background:var(--soft)}
    .btn .only-mobile{display:none}
    .content{padding-top:37px}
    .section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
    .section-head h1,.section-head h2{font:800 clamp(19px,2vw,24px)/1.25 Manrope,sans-serif;letter-spacing:-.85px;margin:0}
    .section-head .heading-side{display:flex;align-items:center;gap:11px}
    .count{background:#e9ebee;color:#5e646d;border-radius:100px;font-weight:800;font-size:11px;padding:5px 9px;min-width:27px;text-align:center}
    .section-action{background:none;border:none;color:#777d86;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;padding:7px 0}
    .section-action:hover{color:#23262b}
    .section-action svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
    .category-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:43px}
    .category-tile{background:#fff;text-align:left;border:1px solid var(--line);border-radius:17px;min-width:0;min-height:127px;padding:19px 19px 16px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;transition:box-shadow .2s,transform .2s,border-color .2s,background .2s}
    .category-tile:hover{transform:translateY(-2px);border-color:#c5c9cf;box-shadow:0 12px 24px #1317200c}
    .category-tile.active{background:#24272c;border-color:#24272c;color:white;box-shadow:0 12px 25px #11131812}
    .category-tile.active .cat-qty,.category-tile.active .cat-name{color:#fff}
    .cat-icon{font-size:35px;line-height:1.15;display:block;height:42px;filter:saturate(.92)}
    .cat-bottom{display:flex;align-items:end;justify-content:space-between;gap:8px;width:100%;min-width:0}
    .cat-name{font-weight:800;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;max-width:100%}
    .cat-qty{font-size:11px;color:#a0a4ad;font-weight:700;flex-shrink:0}
    .web-section{scroll-margin-top:110px}
    .tools{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
    .filter-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .chip{padding:10px 16px;border-radius:100px;border:1px solid var(--line);background:#fff;color:#7b8089;font-weight:800;font-size:12px}
    .chip:hover{border-color:#c5c8ce}
    .chip.active{background:#24272b;border-color:#24272b;color:white}
    .sort-wrap{display:flex;align-items:center;gap:9px;font-size:12px;color:#858a93;font-weight:700}
    .sort-wrap select{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 28px 10px 12px;color:#4b5058;font-size:12px;font-weight:700;cursor:pointer}
    .app-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
    .app-card{min-width:0;position:relative;background:white;border:1px solid #e6e8eb;border-radius:20px;padding:10px;transition:border-color .2s,transform .2s,box-shadow .2s}
    .app-card:hover{transform:translateY(-3px);border-color:#c9cdd2;box-shadow:0 17px 33px #191d2312}
    .card-launch{position:absolute;inset:0;z-index:1;border-radius:19px}
    .cover{height:auto;aspect-ratio:1.55;background:linear-gradient(145deg,#f3f4f6 0%,#ebedf0 100%);display:flex;align-items:center;justify-content:center;border-radius:14px;position:relative;overflow:hidden;isolation:isolate}
    .cover:before{content:'';position:absolute;width:74%;aspect-ratio:1;border:1px solid #e1e3e7;border-radius:50%;pointer-events:none}
    .cover:after{content:'';position:absolute;width:52%;aspect-ratio:1;border:1px solid #e1e3e7;border-radius:50%;pointer-events:none}
    .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1}
    .cover-emoji{position:relative;z-index:1;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-size:clamp(92px,9vw,142px);line-height:1.05;filter:drop-shadow(0 10px 11px #00000018)}
    .card-fav{position:absolute;right:20px;top:20px;z-index:3;width:34px;height:34px;background:#ffffffec;border:1px solid #eceef1;border-radius:10px;display:grid;place-items:center;color:#737982;box-shadow:0 2px 9px #00000009}
    .card-fav svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .card-fav.on svg{fill:#272a2f;stroke:#272a2f}
    .card-info{padding:18px 8px 10px}
    .card-category{font-size:10px;letter-spacing:1px;color:#a0a5ac;font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:9px}
    .card-title{font:800 15px/1.4 Manrope,sans-serif;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}
    .card-desc{font-size:12px;color:#92979f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px;min-height:18px}
    .card-foot{margin-top:17px;border-top:1px solid #eff0f2;padding-top:11px;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .card-foot .go{display:flex;align-items:center;gap:7px;color:#2d3137;font-size:12px;font-weight:800}
    .card-foot .go svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .2s}
    .app-card:hover .go svg{transform:translate(2px,-2px)}
    .card-edit{position:relative;z-index:3;background:none;border:0;color:#9b9fa7;padding:5px;display:grid;place-items:center;border-radius:8px}
    .card-edit:hover{color:#282a2f;background:#f1f2f4}
    .card-edit svg{height:16px;width:16px;stroke:currentColor;fill:none;stroke-width:1.8}
    .empty{grid-column:1/-1;min-height:285px;background:#fff;border:1px dashed #d7dbe0;border-radius:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:25px}
    .empty-symbol{height:56px;width:56px;display:grid;place-items:center;font-size:33px;border-radius:16px;background:#f2f3f5;margin-bottom:6px}
    .empty b{font:800 16px Manrope}
    .empty span{color:#91959d;font-size:12px}
    .empty .btn{margin-top:8px}
    .overlay{position:fixed;inset:0;z-index:30;background:#15181dcc;display:grid;place-items:center;padding:18px;animation:fadein .15s ease-out}
    @keyframes fadein{from{opacity:0}to{opacity:1}}
    .dialog{width:min(570px,100%);max-height:min(830px,calc(100dvh - 36px));overflow:auto;background:#fff;box-shadow:0 30px 90px #0003;border-radius:22px;padding:29px}
    .dialog-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}
    .dialog-head h3{margin:0;font:800 20px Manrope;letter-spacing:-.65px}
    .dialog-head .icon-btn{border:0;background:#f3f4f6;width:33px;min-width:33px;height:33px}
    .form{display:grid;gap:17px}
    .field{display:grid;gap:8px}
    .field label{font-size:12px;font-weight:800;color:#5e646d}
    .field input,.field select,.field textarea{width:100%;background:#fff;border:1px solid #e0e3e7;border-radius:11px;color:#262a2f;padding:12px 13px;outline:none;font-size:13px;min-height:44px}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:#9299a3;box-shadow:0 0 0 3px #20252b0a}
    .field textarea{resize:vertical;min-height:80px}
    .field input::placeholder,.field textarea::placeholder{color:#adb1b9}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:13px}
    .form-actions{display:flex;justify-content:flex-end;align-items:center;gap:9px;margin-top:11px}
    .delete{margin-right:auto;border:0;background:none;color:#ba4d4d;font-size:12px;font-weight:800;cursor:pointer}
    .delete:hover{color:#902828}
    .categories-list{margin-top:20px;border-top:1px solid var(--line)}
    .category-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:11px 0}
    .category-row-main{display:flex;gap:11px;align-items:center;min-width:0}
    .category-row-main .em{font-size:27px;display:grid;place-items:center;width:42px;height:42px;background:#f4f5f6;border-radius:11px}
    .category-row-main strong{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .category-row-main small{font-size:11px;color:#a0a5ad;display:block;margin-top:3px}
    .row-actions{display:flex;gap:4px}
    .row-actions .icon-btn{height:34px;min-width:34px;width:34px}
    .category-create{background:#f6f7f8;border:1px solid #e8eaed;border-radius:14px;padding:15px}
    .category-create .btn{width:100%}
    .dialog-topline{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:10px}
    .backup-grid{display:grid;gap:11px}
    .backup-option{border:1px solid var(--line);border-radius:14px;padding:17px;display:grid;gap:10px}
    .backup-option b{font-size:13px}
    .backup-option .btn{justify-self:start}
    .toast{position:fixed;bottom:25px;right:25px;background:#272a2f;color:#fff;border-radius:12px;padding:13px 18px;z-index:50;font-weight:700;font-size:12px;box-shadow:0 14px 35px #17191e25}
    .hidden{display:none!important}
    @media(max-width:1350px){.category-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.app-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:980px){.brand{min-width:auto}.brand small{display:none}.topbar{gap:13px}.category-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.app-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.btn .desktop-label{display:none}.top-actions .btn{padding:0 12px}.search kbd{display:none}}
    @media(max-width:610px){.shell{padding-left:17px;padding-right:17px}.topbar{min-height:76px;flex-wrap:wrap;gap:10px;padding:12px 17px}.brand{flex:1}.brand strong{font-size:17px}.mark{height:40px;width:40px;border-radius:12px}.top-actions{margin-left:auto;gap:7px}.top-actions .btn{min-height:38px;padding:0 11px}.top-actions .icon-btn{width:38px;min-width:38px;height:38px}.search{order:3;flex:0 0 100%;max-width:none;height:43px}.content{padding-top:26px}.section-head{margin-bottom:14px}.section-head h1,.section-head h2{font-size:19px}.category-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:32px}.category-tile{min-height:114px;padding:16px}.cat-icon{font-size:33px;height:39px}.app-grid{gap:11px}.app-card{padding:7px;border-radius:15px}.cover{border-radius:10px;aspect-ratio:1.12}.cover-emoji{font-size:clamp(83px,19vw,130px)}.card-info{padding:12px 5px 6px}.card-category{font-size:9px;margin-bottom:7px}.card-title{font-size:12px}.card-desc{font-size:10px}.card-foot{margin-top:12px}.card-foot .go{font-size:11px}.card-fav{top:14px;right:14px;width:30px;height:30px}.tools{align-items:flex-start}.sort-wrap{margin-left:auto}.dialog{padding:22px 18px;border-radius:17px}.two{grid-template-columns:1fr 1fr}}
    @media(max-width:375px){.app-grid{grid-template-columns:1fr}.cover{aspect-ratio:1.8}.cover-emoji{font-size:125px}.category-grid{grid-template-columns:repeat(2,1fr)}.btn{font-size:11px}.two{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <header class="top-wrap">
    <div class="topbar">
      <div class="brand" aria-label="KEVIN OS">
        <span class="mark">K</span>
        <span><strong>KEVIN OS</strong><small>APPLICATION HUB</small></span>
      </div>
      <label class="search" for="searchInput">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="7.3"/><path d="m16.5 16.5 5 5"/></svg>
        <input id="searchInput" autocomplete="off" placeholder="Buscar aplicaciones, categorías..." aria-label="Buscar aplicaciones">
        <kbd>Ctrl K</kbd>
      </label>
      <div class="top-actions">
        <button type="button" class="btn" id="newCategoryBtn" aria-label="Nueva categoría"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="desktop-label">Categoría</span></button>
        <button type="button" class="btn primary" id="newAppBtn" aria-label="Nueva web"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="desktop-label">Nueva web</span></button>
        <button type="button" class="icon-btn" id="backupBtn" title="Respaldo de datos" aria-label="Respaldo de datos"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3"/></svg></button>
      </div>
    </div>
  </header>
  <main class="shell content">
    <section aria-labelledby="catsHeading">
      <div class="section-head">
        <div class="heading-side"><h1 id="catsHeading">Categorías</h1><span class="count" id="catCount">0</span></div>
        <button class="section-action" id="manageCategories" type="button">Administrar <svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
      </div>
      <div class="category-grid" id="categoryGrid"></div>
    </section>
    <section class="web-section" aria-labelledby="appsHeading" id="webSection">
      <div class="section-head">
        <div class="heading-side"><h2 id="appsHeading">Aplicaciones</h2><span class="count" id="appCount">0</span></div>
      </div>
      <div class="tools">
        <div class="filter-line" id="quickFilters"></div>
        <label class="sort-wrap">Ordenar <select id="sortBy" aria-label="Ordenar aplicaciones"><option value="recent">Más recientes</option><option value="name">Nombre A–Z</option><option value="category">Categoría</option></select></label>
      </div>
      <div class="app-grid" id="appGrid"></div>
    </section>
  </main>
  <div id="modalRoot"></div>
  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
  <script>
  (()=>{
    'use strict';
    const KEY='kevin-os-workspace-v1';
    const initialCategories=['Oriflame','PuntoFarma','Logística','Finanzas','Personal'];
    const standardIcons={Oriflame:'🏢',PuntoFarma:'💊','Logística':'📦',Finanzas:'📊',Personal:'👤','Sin categoría':'📁'};
    const svg={star:'<svg viewBox="0 0 24 24"><path d="m12 2.8 2.87 5.87 6.48.95-4.68 4.57 1.11 6.45L12 17.6l-5.78 3.04 1.11-6.45-4.68-4.57 6.48-.95L12 2.8z"/></svg>',edit:'<svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L9.5 16.5l-4 1 1-4z"/></svg>',arrow:'<svg viewBox="0 0 24 24"><path d="M5 19 19 5M7 5h12v12"/></svg>',close:'<svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg>',plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 3h4m-8 4 1 14h10l1-14M10 11v6m4-6v6"/></svg>'};
    const $=s=>document.querySelector(s);
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    const validUrl=s=>{try{const u=new URL(s);return ['http:','https:'].includes(u.protocol)&&!!u.hostname}catch{return false}};
    const safeHttp=s=>validUrl(s)?s:'';
    const uid=()=>globalThis.crypto?.randomUUID?.()||String(Date.now())+'-'+Math.random().toString(36).slice(2);
    function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&Array.isArray(o.categories)&&Array.isArray(o.apps))return {categories:o.categories.filter(c=>typeof c==='string'),apps:o.apps.filter(a=>a&&typeof a==='object'),icons:(o.icons&&typeof o.icons==='object'&&!Array.isArray(o.icons))?o.icons:{}}}catch{}return {categories:[...initialCategories],apps:[],icons:{}}}
    let data=load();let activeCat='Todas',filter='all',search='',sort='recent',toastTimeout;
    function store(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{toast('No se pudo guardar en este navegador');return false}}
    function toast(message){const el=$('#toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.add('hidden'),2600)}
    function catIcon(c){return data.icons[c]||standardIcons[c]||'🗂️'}
    function countOf(c){return c==='Todas'?data.apps.length:data.apps.filter(a=>a.category===c).length}
    function viewApps(){let list=data.apps.filter(a=>(activeCat==='Todas'||a.category===activeCat)&&(filter!=='favorites'||a.favorite)&&norm([a.name,a.description,a.category,a.url].join(' ')).includes(norm(search)));
      if(sort==='name')list.sort((a,b)=>String(a.name).localeCompare(String(b.name),'es'));
      if(sort==='category')list.sort((a,b)=>String(a.category).localeCompare(String(b.category),'es')||String(a.name).localeCompare(String(b.name),'es'));
      return list}
    function render(){
      const catList=['Todas',...data.categories];$('#catCount').textContent=data.categories.length;
      $('#categoryGrid').innerHTML=catList.map(c=>`<button type="button" class="category-tile ${activeCat===c?'active':''}" data-cat="${esc(c)}" aria-pressed="${activeCat===c}"><span class="cat-icon">${esc(c==='Todas'?'◈':catIcon(c))}</span><span class="cat-bottom"><span class="cat-name">${esc(c)}</span><span class="cat-qty">${countOf(c)}</span></span></button>`).join('');
      $('#quickFilters').innerHTML=`<button class="chip ${filter==='all'?'active':''}" data-filter="all" aria-pressed="${filter==='all'}">Todas</button><button class="chip ${filter==='favorites'?'active':''}" data-filter="favorites" aria-pressed="${filter==='favorites'}">★ Favoritos</button>`;
      const apps=viewApps();$('#appCount').textContent=apps.length;$('#appsHeading').textContent=activeCat==='Todas'?'Aplicaciones':activeCat;
      $('#appGrid').innerHTML=apps.length?apps.map(a=>{
        const src=safeHttp(a.image||'');const emoji=esc(a.emoji||'🌐');
        return `<article class="app-card" data-id="${esc(a.id)}">
          <div class="cover">${src?`<img loading="lazy" decoding="async" alt="" src="${esc(src)}">`:''}<span class="cover-emoji">${emoji}</span></div>
          <button class="card-fav ${a.favorite?'on':''}" type="button" data-fav="${esc(a.id)}" aria-label="${a.favorite?'Quitar de favoritos':'Agregar a favoritos'}" title="Favorito">${svg.star}</button>
          <div class="card-info"><div class="card-category">${esc(a.category||'Sin categoría')}</div><h3 class="card-title" title="${esc(a.name)}">${esc(a.name)}</h3><div class="card-desc" title="${esc(a.description||'')}">${esc(a.description||'')}</div>
          <div class="card-foot"><span class="go">Abrir aplicación ${svg.arrow}</span><button type="button" class="card-edit" data-edit="${esc(a.id)}" aria-label="Editar ${esc(a.name)}" title="Editar aplicación">${svg.edit}</button></div></div>
          <a class="card-launch" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer" aria-label="Abrir ${esc(a.name)} en otra pestaña"></a>
          </article>`}).join(''):
        `<div class="empty"><div class="empty-symbol">${search?'⌕':'▦'}</div><b>${search?'Sin resultados':filter==='favorites'?'No hay favoritos':'No hay aplicaciones'}</b>${search?'<span>Prueba otra búsqueda</span>':''}${!search&&filter!=='favorites'?'<button class="btn primary" id="emptyAdd" type="button">＋ Nueva web</button>':''}</div>`;
    }
    function setCategory(c){activeCat=c;render()}
    function closeModal(){const el=$('#modalRoot');el.replaceChildren();document.removeEventListener('keydown',handleEsc);document.body.style.overflow='';}
    function handleEsc(e){if(e.key==='Escape')closeModal()}
    function showModal(title,content){closeModal();$('#modalRoot').innerHTML=`<div class="overlay" id="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dialog-head"><h3>${esc(title)}</h3><button type="button" class="icon-btn" id="modalClose" aria-label="Cerrar">${svg.close}</button></div>${content}</div></div>`;$('#modalClose').onclick=closeModal;$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});document.addEventListener('keydown',handleEsc);document.body.style.overflow='hidden';setTimeout(()=>$('#modalRoot input:not([type=file])')?.focus(),20)}
    function openAppEditor(id){const a=id?data.apps.find(x=>String(x.id)===String(id)):null;const opts=data.categories.map(c=>`<option value="${esc(c)}" ${a?.category===c?'selected':''}>${esc(c)}</option>`).join('');
      showModal(a?'Editar web':'Nueva web',`<form id="appForm" class="form"><div class="field"><label for="appName">Nombre</label><input id="appName" maxlength="100" required value="${esc(a?.name||'')}" placeholder="Nombre de aplicación"></div><div class="field"><label for="appUrl">Enlace</label><input id="appUrl" type="url" maxlength="2048" required value="${esc(a?.url||'')}" placeholder="https://usuario.github.io/proyecto/"></div><div class="field"><label for="appDesc">Descripción</label><textarea id="appDesc" maxlength="240" placeholder="Descripción de la aplicación">${esc(a?.description||'')}</textarea></div><div class="two"><div class="field"><label for="appCat">Categoría</label><select id="appCat" required>${opts}</select></div><div class="field"><label for="appEmoji">Emoji</label><input id="appEmoji" maxlength="20" value="${esc(a?.emoji||'🌐')}" placeholder="🌐"></div></div><div class="field"><label for="appImg">URL de la imagen</label><input id="appImg" type="url" maxlength="2048" placeholder="https://usuario.github.io/proyecto/portada.webp" value="${esc(a?.image||'')}"></div><div class="form-actions">${a?'<button type="button" id="deleteApp" class="delete">Eliminar web</button>':''}<button type="button" class="btn" id="cancelApp">Cancelar</button><button type="submit" class="btn primary">${a?'Guardar cambios':'Agregar web'}</button></div></form>`);
      $('#cancelApp').onclick=closeModal;
      if(a)$('#deleteApp').onclick=()=>{if(confirm(`¿Eliminar "${a.name}"?`)){data.apps=data.apps.filter(x=>x!==a);store();render();closeModal();toast('Web eliminada')}};
      $('#appForm').onsubmit=e=>{e.preventDefault();const name=$('#appName').value.trim(),url=$('#appUrl').value.trim(),image=$('#appImg').value.trim();if(!validUrl(url)||(image&&!validUrl(image))){toast('Revisa la URL ingresada');return}const obj={name,url,description:$('#appDesc').value.trim(),category:$('#appCat').value,emoji:$('#appEmoji').value.trim()||'🌐',image};if(a)Object.assign(a,obj);else data.apps.unshift({...obj,id:uid(),favorite:false});if(!store())return;activeCat='Todas';filter='all';search='';$('#searchInput').value='';closeModal();render();toast(a?'Web actualizada':'Web agregada')};
    }
    function categoryManager(){const list=data.categories.map(c=>`<div class="category-row"><div class="category-row-main"><span class="em">${esc(catIcon(c))}</span><div><strong>${esc(c)}</strong><small>${countOf(c)} ${countOf(c)===1?'web':'webs'}</small></div></div><div class="row-actions"><button type="button" class="icon-btn" data-cat-edit="${esc(c)}" aria-label="Editar ${esc(c)}">${svg.edit}</button><button type="button" class="icon-btn" data-cat-delete="${esc(c)}" aria-label="Eliminar ${esc(c)}">${svg.trash}</button></div></div>`).join('');
      showModal('Categorías',`<form id="newCatForm" class="form category-create"><div class="two"><div class="field"><label for="newCatName">Nombre</label><input id="newCatName" maxlength="48" required placeholder="Nueva categoría"></div><div class="field"><label for="newCatEmoji">Emoji</label><input id="newCatEmoji" maxlength="20" value="🗂️"></div></div><button class="btn primary" type="submit">${svg.plus} Crear categoría</button></form><div class="categories-list">${list}</div>`);
      $('#newCatForm').onsubmit=e=>{e.preventDefault();const name=$('#newCatName').value.trim(),emoji=$('#newCatEmoji').value.trim()||'🗂️';if(!name)return;if(data.categories.some(c=>norm(c)===norm(name))||norm(name)==='todas'){toast('La categoría ya existe');return}data.categories.push(name);data.icons[name]=emoji;if(!store())return;categoryManager();render();toast('Categoría creada')};
      $('#modalRoot').querySelectorAll('[data-cat-edit]').forEach(btn=>btn.onclick=()=>editCategory(btn.dataset.catEdit));
      $('#modalRoot').querySelectorAll('[data-cat-delete]').forEach(btn=>btn.onclick=()=>{const name=btn.dataset.catDelete,n=countOf(name);if(!confirm(`¿Eliminar "${name}"?${n?' Sus aplicaciones quedarán en "Sin categoría".':''}`))return;data.categories=data.categories.filter(c=>c!==name);delete data.icons[name];if(n){if(!data.categories.includes('Sin categoría'))data.categories.push('Sin categoría');data.apps.forEach(a=>{if(a.category===name)a.category='Sin categoría'})}if(activeCat===name)activeCat='Todas';if(!data.categories.length)data.categories=['Personal'];if(!store())return;categoryManager();render();toast('Categoría eliminada')});
    }
    function editCategory(old){showModal('Editar categoría',`<form class="form" id="editCatForm"><div class="field"><label for="editCatName">Nombre</label><input id="editCatName" maxlength="48" required value="${esc(old)}"></div><div class="field"><label for="editCatIcon">Emoji</label><input id="editCatIcon" maxlength="20" value="${esc(catIcon(old))}"></div><div class="form-actions"><button type="button" class="btn" id="backCats">Cancelar</button><button type="submit" class="btn primary">Guardar cambios</button></div></form>`);$('#backCats').onclick=categoryManager;$('#editCatForm').onsubmit=e=>{e.preventDefault();const next=$('#editCatName').value.trim(),emoji=$('#editCatIcon').value.trim()||'🗂️';if(!next)return;if((norm(next)!==norm(old)&&data.categories.some(c=>norm(c)===norm(next)))||norm(next)==='todas'){toast('La categoría ya existe');return}data.categories=data.categories.map(c=>c===old?next:c);data.apps.forEach(a=>{if(a.category===old)a.category=next});if(activeCat===old)activeCat=next;delete data.icons[old];data.icons[next]=emoji;if(!store())return;categoryManager();render();toast('Categoría actualizada')};}
    function backupManager(){showModal('Respaldo de datos',`<div class="backup-grid"><div class="backup-option"><b>Exportar datos</b><button type="button" id="exportBtn" class="btn primary">Exportar JSON</button></div><div class="backup-option"><b>Importar datos</b><input type="file" id="importFile" accept=".json,application/json"></div></div>`);
      $('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='kevin-os-respaldo-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)};
      $('#importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>5_000_000)throw Error('Archivo muy grande');const raw=JSON.parse(await f.text());if(!raw||!Array.isArray(raw.apps)||!Array.isArray(raw.categories)||raw.apps.length>5000||raw.categories.length>500||!raw.categories.every(c=>typeof c==='string'&&c.trim().length>0&&c.length<=48)||!raw.apps.every(a=>a&&typeof a.name==='string'&&typeof a.url==='string'&&validUrl(a.url)&&typeof a.category==='string'))throw Error('Datos inválidos');if(!confirm('¿Reemplazar todas las webs y categorías por este respaldo?'))return;const categories=[...new Set(raw.categories)],apps=raw.apps.map(a=>({id:uid(),name:String(a.name).slice(0,100),url:a.url,description:String(a.description||'').slice(0,240),category:a.category,emoji:String(a.emoji||'🌐').slice(0,20),image:safeHttp(a.image||''),favorite:!!a.favorite}));for(const a of apps)if(!categories.includes(a.category))categories.push(a.category);data={categories:categories.length?categories:['Personal'],apps,icons:(raw.icons&&typeof raw.icons==='object'&&!Array.isArray(raw.icons))?Object.fromEntries(Object.entries(raw.icons).filter(([k,v])=>typeof v==='string').map(([k,v])=>[k,v.slice(0,20)])):{}};if(!store())return;activeCat='Todas';filter='all';search='';$('#searchInput').value='';closeModal();render();toast('Respaldo importado')}catch{toast('Archivo no válido')}};
    }
    $('#newAppBtn').onclick=()=>openAppEditor();$('#newCategoryBtn').onclick=categoryManager;$('#manageCategories').onclick=categoryManager;$('#backupBtn').onclick=backupManager;
    $('#searchInput').oninput=e=>{search=e.target.value.trim();render()};
    $('#categoryGrid').onclick=e=>{const b=e.target.closest('[data-cat]');if(b)setCategory(b.dataset.cat)};
    $('#quickFilters').onclick=e=>{const b=e.target.closest('[data-filter]');if(b){filter=b.dataset.filter;render()}};
    $('#sortBy').onchange=e=>{sort=e.target.value;render()};
    $('#appGrid').addEventListener('click',e=>{const fav=e.target.closest('[data-fav]'),edit=e.target.closest('[data-edit]');if(fav){const a=data.apps.find(p=>String(p.id)===fav.dataset.fav);if(a){a.favorite=!a.favorite;store();render()}}else if(edit)openAppEditor(edit.dataset.edit);else if(e.target.id==='emptyAdd')openAppEditor()});
    $('#appGrid').addEventListener('error',e=>{if(e.target.matches('.cover img'))e.target.remove()},true);
    document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#searchInput').focus();$('#searchInput').select()}});
    window.addEventListener('storage',e=>{if(e.key===KEY){data=load();if(activeCat!=='Todas'&&!data.categories.includes(activeCat))activeCat='Todas';render()}});
    render();
  })();
  </script>
</body>
</html>
